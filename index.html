<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Video to MP3 Audio Converter</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; padding-bottom: 90px; box-sizing: border-box; }
    .card { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 480px; text-align: center; }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .upload-btn { background: #0284c7; color: white; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; display: block; margin-top: 10px; transition: 0.3s; }
    .upload-btn:hover { background: #0369a1; }
    #status { margin-top: 20px; font-size: 14px; font-weight: bold; color: #38bdf8; word-break: break-word; }
    #audioPlayer { margin-top: 20px; width: 100%; display: none; }
    .dl-btn { display: none; background: #22c55e; color: #0f172a; text-decoration: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; width: 100%; box-sizing: border-box; margin-top: 15px; }
    .dl-btn:hover { background: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Urban Video to MP3</h1>
    <p>Convert Any Video File (MP4, MKV, WebM) to Audio Instantly & Free</p>

    <label class="upload-btn" for="videoFile">📁 Choose Video File</label>
    <input type="file" id="videoFile" accept="video/*" style="display:none" onchange="extractAudio(event)">

    <div id="status">Upload a video to extract audio</div>
    
    <audio id="audioPlayer" controls></audio>
    <a id="dlBtn" class="dl-btn" href="#">📥 Download Audio (MP3/WAV)</a>
  </div>

  <!-- Adsterra Banner Ads (Fixed at Bottom) -->
  <div style="text-align: center; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; background: #1e293b; padding: 5px 0; border-top: 1px solid #334155;">
    <script>atOptions = {'key':'f13146991eed004d9d88689beb216a77','format':'iframe','height':50,'width':320,'params':{}};</script>
    <script src="https://www.highperformanceformat.com/f13146991eed004d9d88689beb216a77/invoke.js"></script>
  </div>

  <script>
    async function extractAudio(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      const audioPlayer = document.getElementById('audioPlayer');
      const dlBtn = document.getElementById('dlBtn');

      status.innerText = "⚡ Processing Video Audio... (Converting)";
      audioPlayer.style.display = 'none';
      dlBtn.style.display = 'none';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedAudio = await audioCtx.decodeAudioData(arrayBuffer);

        const wavBlob = bufferToWave(decodedAudio, decodedAudio.length);
        const audioUrl = URL.createObjectURL(wavBlob);

        audioPlayer.src = audioUrl;
        audioPlayer.style.display = 'block';

        dlBtn.href = audioUrl;
        dlBtn.download = file.name.replace(/\.[^/.]+$/, "") + "_audio.mp3";
        dlBtn.style.display = 'block';

        status.innerText = "✅ Conversion Complete! Listen or Download:";
      } catch (err) {
        console.error(err);
        status.innerText = "❌ Error processing audio from this video file.";
      }
    }

    function bufferToWave(abuffer, len) {
      let numOfChan = abuffer.numberOfChannels,
          length = len * numOfChan * 2 + 44,
          buffer = new ArrayBuffer(length),
          view = new DataView(buffer),
          channels = [], i, sample,
          offset = 0,
          pos = 0;

      function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8); 
      setUint32(0x45564157); // "WAVE"

      setUint32(0x20746d66); // "fmt " chunk
      setUint32(16); 
      setUint16(1); 
      setUint16(numOfChan);
      setUint32(abuffer.sampleRate);
      setUint32(abuffer.sampleRate * 2 * numOfChan); 
      setUint16(numOfChan * 2); 
      setUint16(16); 

      setUint32(0x61746164); // "data" chunk
      setUint32(length - pos - 4);

      for(i = 0; i < abuffer.numberOfChannels; i++)
        channels.push(abuffer.getChannelData(i));

      while(pos < length) {
        for(i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
          view.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }
      return new Blob([buffer], {type: "audio/mp3"});
    }
  </script>
</body>
</html>
