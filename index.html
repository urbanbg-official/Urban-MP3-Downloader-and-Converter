<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban MP3 Downloader & Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; padding-bottom: 80px; }
    .container { width: 100%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    h1 { color: #f43f5e; font-size: 24px; margin-bottom: 5px; }
    p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 15px; text-align: center; }
    .btn-action { width: 100%; background: #f43f5e; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-action:hover { background: #e11d48; }
    #downloadResult { margin-top: 20px; width: 100%; }
    iframe { width: 100%; height: 180px; border: none; border-radius: 10px; }
  </style>
</head>
<body>

  <!-- Adsterra Banner Ad -->
  <div style="text-align: center; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; background: #1e293b; padding: 5px 0; border-top: 1px solid #334155;">
    <script>
      atOptions = {
        'key' : 'f13146991eed004d9d88689beb216a77',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/f13146991eed004d9d88689beb216a77/invoke.js"></script>
  </div>

  <div class="container">
    <h1>Urban MP3 Downloader</h1>
    <p class="subtitle">Convert & Download High Quality MP3 / MP4</p>

    <input type="text" id="videoUrl" placeholder="Paste YouTube / Shorts Link Here...">
    
    <button class="btn-action" onclick="fetchAudio()">🚀 Convert & Download MP3</button>

    <div id="downloadResult"></div>
  </div>

  <script>
    function fetchAudio() {
      const url = document.getElementById('videoUrl').value.trim();
      const resultDiv = document.getElementById('downloadResult');

      if (!url) {
        alert("Please paste a YouTube link first!");
        return;
      }

      resultDiv.innerHTML = "<p style='color:#38bdf8; margin-top:15px;'>Processing video... Please wait...</p>";

      // Extract YouTube Video ID
      let videoId = "";
      if (url.includes("youtu.be/")) {
        videoId = url.split("youtu.be/")[1].split("?")[0];
      } else if (url.includes("youtube.com/shorts/")) {
        videoId = url.split("shorts/")[1].split("?")[0];
      } else if (url.includes("watch?v=")) {
        videoId = url.split("watch?v=")[1].split("&")[0];
      }

      if (videoId) {
        // Embed direct converter iframe widget inside app screen
        resultDiv.innerHTML = `<iframe src="https://loader.to/api/card/?url=https://www.youtube.com/watch?v=${videoId}&f=mp3" scrolling="no"></iframe>`;
      } else {
        // Fallback working downloader
        resultDiv.innerHTML = `<a href="https://ytmp3.nu/en/" target="_blank"><button class="btn-action" style="background:#22c55e; margin-top:10px;">Click Here to Open Direct Downloader</button></a>`;
      }
    }
  </script>
</body>
</html>
