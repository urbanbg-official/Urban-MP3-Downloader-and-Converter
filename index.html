<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban MP3 Downloader & Converter</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 480px; text-align: center; }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; box-sizing: border-box; font-size: 15px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #0284c7; color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
    button:hover { background: #0369a1; }
    #status { margin-top: 15px; font-size: 14px; font-weight: bold; word-break: break-word; color: #38bdf8; }
    #downloadBox { margin-top: 20px; display: none; }
    .dl-btn { display: inline-block; background: #22c55e; color: #0f172a; text-decoration: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; width: 100%; box-sizing: border-box; }
    .dl-btn:hover { background: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Urban MP3 Converter</h1>
    <p>Convert YouTube, FB & Video Links to High Quality MP3</p>
    
    <input type="text" id="videoUrl" placeholder="Paste Video Link (YouTube, Facebook, Insta...)">
    <button onclick="convertVideo()">🎵 Convert to MP3</button>

    <div id="status"></div>

    <div id="downloadBox">
      <a id="dlLink" class="dl-btn" href="#" target="_blank" download>📥 Download MP3 Audio</a>
    </div>
  </div>

  <script>
    async function convertVideo() {
      const urlInput = document.getElementById('videoUrl').value.trim();
      const status = document.getElementById('status');
      const downloadBox = document.getElementById('downloadBox');
      const dlLink = document.getElementById('dlLink');

      if (!urlInput) {
        status.innerText = "❌ Please paste a valid video link!";
        return;
      }

      status.innerText = "⚡ Fetching & Extracting MP3 Audio... Please wait.";
      downloadBox.style.display = 'none';

      try {
        // Calling Cobalt API (100% Free & Unlimited Media Extractor)
        const response = await fetch("https://api.cobalt.tools/api/json", {
          method: "POST",
          headers: {
            "Accept": "application/json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url: urlInput,
            downloadMode: "audio",
            audioFormat: "mp3"
          })
        });

        const data = await response.json();

        if (data.status === "redirect" || data.status === "stream" || data.status === "tunnel") {
          dlLink.href = data.url;
          downloadBox.style.display = 'block';
          status.innerText = "✅ Conversion Successful!";
        } else if (data.status === "picker") {
          dlLink.href = data.audio || data.picker[0].url;
          downloadBox.style.display = 'block';
          status.innerText = "✅ Audio Extracted Successfully!";
        } else {
          status.innerText = "❌ Couldn't convert this video. Make sure the video is public.";
        }

      } catch (err) {
        console.error(err);
        status.innerText = "❌ Server Busy or Invalid URL. Please try again.";
      }
    }
  </script>
</body>
</html>
