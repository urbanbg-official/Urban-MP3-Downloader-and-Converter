    body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 450px; background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: #f43f5e; font-size: 26px; }
    input { width: 100%; padding: 15px; border-radius: 10px; border: none; margin-top: 20px; text-align: center; font-size: 16px; }
    .btn { background: #f43f5e; color: white; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; font-size: 16px; }
  </style>
</head>
<body>

  <!-- Adsterra Banner -->
  <div style="text-align: center; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; background: #1e293b; padding: 5px 0;">
    <script>atOptions = {'key':'f13146991eed004d9d88689beb216a77','format':'iframe','height':50,'width':320,'params':{}};</script>
    <script src="https://www.highperformanceformat.com/f13146991eed004d9d88689beb216a77/invoke.js"></script>
  </div>

  <div class="container">
    <h1>Urban MP3 Downloader</h1>
    <p style="color:#94a3b8; margin-top:10px;">Paste YouTube Video Link Below:</p>
    
    <input type="text" id="ytUrl" placeholder="https://youtube.com/...">
    <button class="btn" onclick="generateDownload()">Get Download Link</button>
    
    <div id="result" style="margin-top:20px;"></div>
  </div>

  <script>
    function generateDownload() {
      const url = document.getElementById('ytUrl').value;
      const res = document.getElementById('result');
      
      if(!url.includes("youtu")) {
        alert("Please enter a valid YouTube link.");
        return;
      }
      
      // यह तरीका सबसे पक्का है - यह यूज़र को सीधे कनवर्टर पर ले जाता है
      res.innerHTML = `
        <p style="color:#22c55e; margin-bottom:10px;">Link Ready! Click button below:</p>
        <a href="https://ddownr.com/?url=${encodeURIComponent(url)}" target="_blank">
          <button class="btn" style="background:#22c55e;">📥 Download MP3/MP4</button>
        </a>
      `;
    }
  </script>
</body>
</html>
